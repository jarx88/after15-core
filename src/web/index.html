function settlementGrosz(value){
  const match=/^(\d{1,10})(?:[.,](\d{1,2}))?$/.exec(String(value).trim());
  if(!match)return null;
  const amount=Number(match[1])*100+Number((match[2]||'').padEnd(2,'0'));
  return amount>0&&amount<=100000000000?amount:null;
}

function settlementBalance(projects,entries){

  return {paid,balance:Math.round((projects.overtime_pln+projects.b2b_pln)*100)-paid};
}

      ledger=await(await api('/api/settlements/import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount_grosz:legacy})})).json();

  g.fillStyle=C.o;g.beginPath();
  g.moveTo(u(-3.9),u(-.6));
  g.quadraticCurveTo(u(-3.7),u(-3.7),u(-.4),u(-3.9));
  g.quadraticCurveTo(u(3.1),u(-3.8),u(3.5),u(-1));
  g.quadraticCurveTo(u(5.7),u(-.6),u(5.8),u(.7));
  g.quadraticCurveTo(u(5.5),u(2.1),u(2.6),u(2.5));
  g.quadraticCurveTo(u(-1.4),u(3.5),u(-3.4),u(1.6));
  g.closePath();g.fill();
  g.save();g.clip();
  g.fillStyle=C.l;g.beginPath();g.ellipse(u(-.5),u(-2.7),u(3.5),u(1.8),0,0,7);g.fill();
  g.fillStyle=C.w;g.beginPath();g.ellipse(u(2.7),u(1.6),u(3.3),u(1.8),.12,0,7);g.fill();
  g.restore();
  g.fillStyle=C.k;g.beginPath();g.ellipse(u(5.2),u(.5),u(1),u(.85),0,0,7);g.fill();
  if(mouth>.1){g.fillStyle=C.m;g.beginPath();g.ellipse(u(3.9),u(2),u(1.2)*mouth,u(1)*mouth,0,0,7);g.fill();
    g.fillStyle=C.p;g.beginPath();g.ellipse(u(3.9),u(2.45*mouth+.55),u(.75)*mouth,u(.45)*mouth,0,0,7);g.fill()}
  if(eye>.15){g.fillStyle=C.e;g.beginPath();g.ellipse(u(1.1),u(-.5),u(.85),u(1.05)*eye,0,0,7);g.fill();
    g.fillStyle=C.w;g.beginPath();g.ellipse(u(.82),u(-.88),u(.26),u(.3),0,0,7);g.fill()}
  else{g.strokeStyle=C.k;g.lineWidth=u(.6);g.lineCap='round';g.beginPath();
       g.moveTo(u(.4),u(-.4));g.lineTo(u(1.9),u(-.4));g.stroke()}
  g.fillStyle=C.p;g.globalAlpha=.5;                    // policzki
  g.beginPath();g.ellipse(u(2.5),u(.95),u(.95),u(.5),0,0,7);g.fill();
  g.globalAlpha=1;
  g.strokeStyle=C.k;g.lineWidth=u(.28);                // wąsy
  g.beginPath();g.moveTo(u(4.6),u(1.1));g.lineTo(u(6.4),u(.7));
  g.moveTo(u(4.6),u(1.5));g.lineTo(u(6.5),u(1.6));g.stroke();
  g.restore();
}
const BASE={legFR:0,legFL:0,legBR:0,legBL:0,legLen:3.5,bodyY:0,bodyRot:0,headY:0,headX:0,headRot:0,
            tailRot:0,earRot:0,eye:1,mouth:0,squat:0,lying:0,fluff:1};
const POSE={
  walk:{},run:{bodyRot:-.06,legLen:3.3},idle:{},
  sit:{legFR:.05,legFL:.05,legBR:1.5,legBL:1.5,legLen:2.4,squat:-1,bodyRot:.42,headX:-1.9,headY:-1.9,tailRot:.62,fluff:1.05},
  yawn:{legFR:.05,legFL:.05,legBR:1.5,legBL:1.5,legLen:2.4,squat:-1,bodyRot:.42,headX:-1.9,headY:-2.1,tailRot:.5,eye:0,mouth:1,earRot:-.2},
  sleep:{legFR:1.6,legFL:1.6,legBR:1.55,legBL:1.55,legLen:1,squat:-3,lying:1,headX:-2.2,headY:3.5,tailRot:1.5,eye:0,fluff:1.1},
  jump:{legFR:1.1,legFL:1.3,legBR:-1.1,legBL:-1.3,legLen:2.8,tailRot:-.6,bodyRot:-.14},
  sniff:{legFR:.2,legFL:-.15,legBR:-.15,legBL:.2,headX:1.2,headY:3,headRot:.35,tailRot:-.1},
  spin:{bodyRot:-.1,tailRot:-.7},
};
const rnd=(a,b)=>a+Math.random()*(b-a)|0;
// dymek: lisek mówi, co myśli o twoich nadgodzinach
const bubble=$('#pet-bubble');
let sayT=null;
function say(txt){
  if(!txt)return;
  bubble.textContent=txt;
  bubble.style.left=(x+UW*S/2)+'px';
  bubble.classList.add('on');
  clearTimeout(sayT);sayT=setTimeout(()=>bubble.classList.remove('on'),2600);
}
// ślady łapek przy bieganiu
function paw(){
  const p=document.createElement('i');
  p.className='paw';
  p.style.left=(x+UW*S/2+rnd(-6,6))+'px';
  document.body.appendChild(p);setTimeout(()=>p.remove(),2800);
}
const DUR={walk:[60,200],run:[30,80],sit:[80,260],sleep:[240,700],idle:[20,70],yawn:[26,26],sniff:[50,110],jump:[80,80],spin:[26,26]};
const cur={...BASE};
let x=40,air=0,vy=0,dir=1,mode='walk',after=null,t=0,phase=0,tick=0,blink=0,target=null;
// nastrój z realnych danych: porównuje nadgodziny bieżącego miesiąca ze średnią roczną
let mood='ok',moodRatio=1;
const MOOD=r=>{
  if(r>=2)return{name:'wypalony',v:3};
  if(r>=1.25)return{name:'zmeczony',v:2};
  if(r>=.6)return{name:'ok',v:1};
  return{name:'wypoczęty',v:0};
};
(async()=>{try{
  const d=await(await api('/api/months')).json();
  const cur=d.months.find(m=>m.current);
  if(cur&&d.average_hours>0){
    moodRatio=Math.max(.25,cur.hours/d.average_hours);
    mood=MOOD(moodRatio);
    say({wypalony:'za dużo tych nadgodzin…',zmeczony:'biorę kawę.',ok:'dzień dobry!',wypoczęty:'czysta głowa!'}[mood.name]);
  }
}catch(e){}})();
function setMode(m,next){
  mode=m;after=next||null;t=rnd(DUR[m][0],DUR[m][1]);
  pet.classList.toggle('asleep',m==='sleep');
  if(m==='jump'){vy=6.4;air=0}
}
function fx(sym,cls){
  const e=document.createElement('div');
  e.className='pet-fx '+cls;e.textContent=sym;
  e.style.left=(x+UW*S/2)+'px';e.style.bottom=(UH*S*.75+air)+'px';
  e.style.setProperty('--dx',rnd(-14,14)+'px');
  document.body.appendChild(e);setTimeout(()=>e.remove(),1000);
}
// Free intervals for the canvas's left edge, with room for jumps and a small gap.
function petLanes(width,height,petWidth,petHeight,rects){
  if(width<petWidth)return [];
  let free=[[0,width-petWidth]];
  for(const r of rects){
    if(r.width<=0||r.height<=0||r.bottom<=height-petHeight||r.top>=height)continue;
    const left=r.left-petWidth-8,right=r.right+8;
    free=free.flatMap(([a,b])=>right<=a||left>=b?[[a,b]]:
      [...(left>a?[[a,left]]:[]),...(right<b?[[right,b]]:[])]);
  }
  return free;
}
let lanes=[];
function step(){
  if(document.hidden)return;
  tick++;
  const max=Math.max(0,innerWidth-cv.width/DPR);
  if(tick%5===1)lanes=petLanes(innerWidth,innerHeight,cv.width/DPR,cv.height/DPR+40,
    [...document.querySelectorAll('.cell:not(.empty),.data-table,.project-panel,.projects-table,#settlements,.chart,.drawer,.legend,button,input,select,textarea,.note,.toast')]
      .filter(e=>e.getClientRects().length)
      .map(e=>{
        if(e.matches('.note')){const r=document.createRange();r.selectNodeContents(e);return r.getBoundingClientRect()}
        return e.getBoundingClientRect();
      }));
  pet.style.visibility=lanes.length?'visible':'hidden';
  if(!lanes.length){bubble.classList.remove('on');return}
  const lane=lanes.find(([a,b])=>x>=a&&x<=b)||lanes.reduce((best,l)=>
    Math.abs(Math.max(l[0],Math.min(l[1],x))-x)<Math.abs(Math.max(best[0],Math.min(best[1],x))-x)?l:best);
  const escaping=x<lane[0]||x>lane[1];
  if(escaping){target=Math.max(lane[0],Math.min(lane[1],x));if(mode!=='walk')setMode('walk');t=40;air=0}
  else if(target!==null)target=Math.max(lane[0],Math.min(lane[1],target));
  if(blink)blink--;
  else if(Math.random()<.012&&mode!=='sleep'&&mode!=='yawn')blink=3;
  const moving=mode==='walk'||mode==='run'||mode==='sniff';
  if(moving){
    // zmęczony lisek zwalnia, wypoczęty ma napady energii (zoomies)
    const boost=mood.v===3?.55:mood.v===2?.75:mood.v===0&&Math.sin(tick*.004)>.7?1.9:1;
    const v=(mode==='run'?3:mode==='sniff'?.4:.95)*boost;
    if(target!==null){
      dir=target>x?1:-1;
      if(Math.abs(target-x)<v){x=target;target=null;setMode('sit')}
    }
    x+=dir*v;
    if(x>=max){x=max;dir=-1}
    if(x<=0){x=0;dir=1}
    phase+=(mode==='run'?.42:mode==='sniff'?.09:.24)*boost;
    if(mode==='run'&&tick%6===0)paw();
  }else if(mode==='jump'){
    vy-=.55;air+=vy;
    x=Math.max(0,Math.min(max,x+dir*1.8));
    if(air<=0){air=0;setMode('run')}
  }else if(mode==='spin'){
    if(tick%3===0)dir=-dir;
    phase+=.5;
  }
  if(!escaping){
    if(x>=lane[1]){x=lane[1];dir=-1}
    if(x<=lane[0]){x=lane[0];dir=1}
  }
  // płynne dojście do docelowej pozy
  const goal={...BASE,...POSE[mode]};
  for(const k in goal)cur[k]+=(goal[k]-cur[k])*.2;
  const P={...cur};
  if(moving||mode==='spin'){                       // cykl kroków na wierzchu pozy
    const a=mode==='run'?.6:mode==='sniff'?.22:.42;
    P.legFR+=a*Math.sin(phase);P.legBL+=a*Math.sin(phase);
    P.legFL+=a*Math.sin(phase+Math.PI);P.legBR+=a*Math.sin(phase+Math.PI);
    P.bodyY-=Math.abs(Math.sin(phase))*.3;
    P.tailRot+=.12*Math.sin(phase*.6);
  }else if(mode==='sleep'){
    P.bodyY-=Math.sin(tick*.08)*.18;               // oddech
  }else if(mode==='sit'||mode==='idle'){
    P.tailRot+=.16*Math.sin(tick*.09);             // machanie ogonem
  }
  if(blink)P.eye=.12;
  og.clearRect(0,0,UW,UH);
  og.save();
  if(dir<0){og.translate(UW,0);og.scale(-1,1)}
  drawFox(og,P);
  og.restore();
  pixelize();
  cx.clearRect(0,0,cv.width,cv.height);
  cx.drawImage(off,0,0,cv.width,cv.height);
  // pozycja przypięta do siatki fizycznych pikseli — na ułamkowej lisek rozmywa
  // się przy kompozytowaniu i ciągnie za sobą smugę
  pet.style.transform='translate('+snap(x)+'px,'+snap(-air)+'px)';
  if(--t>0||mode==='jump')return;
  // zmęczony częściej siada i śpi, wypoczęty częściej biega
  const tired=mood.v>=2;
  const fresh=mood.v===0;
  if(mode==='walk'){const r=Math.random();if(fresh&&r>.55){fx('💨','spark');say('zoomies!')}setMode(tired?(r<.6?'sit':'sniff'):fresh?(r<.3?'run':'walk'):r<.4?'sit':r<.7?'sniff':'idle')}
  else if(mode==='sniff')setMode(Math.random()<(tired?.5:.3)?'sit':'walk');
  else if(mode==='sit'){const r=Math.random();if(tired&&r<.35){fx('☕','heart');say('kawa…')}setMode(r<(tired?.65:.45)?'yawn':'walk',Math.random()<(tired?.75:.45)?'sleep':null)}
  else if(mode==='yawn')setMode(after||'sit');
  else if(mode==='sleep')setMode('yawn','sit');
  else if(mode==='run'||mode==='spin')setMode('walk');
  else{if(Math.random()<.35)dir=-dir;setMode('walk')}
}
setInterval(step,50);
pet.onclick=()=>{
  if(mode==='sleep'){setMode('yawn','sit');fx('?','spark');say('chwilę jeszcze…');return}
  fx('♥','heart');dir=Math.random()<.5?-1:1;
  if(mood.v===3)say(['zostaw mnie…','potem, proszę','nie dziś'][rnd(0,3)]);
  else if(mood.v===0)say(['jeszcze jedno skok!','hura!'][rnd(0,2)]);
  setMode(mood.v===2?'sit':'jump');
};
pet.ondblclick=()=>{fx('✨','spark');setMode('spin')};
addEventListener('mousemove',e=>{
  if(mode==='sleep'||mode==='jump'||mode==='spin')return;
  if(innerHeight-e.clientY>90)return;
  target=Math.max(0,Math.min(innerWidth-UW*S,e.clientX-UW*S/2));
  if(mode!=='walk'&&mode!=='run')setMode('walk');else if(t<40)t=40;
},{passive:true});
window.petCheer=()=>{if(mode==='sleep')setMode('sit');fx('✨','spark');setMode('jump')};
})();
</script></body></html>
