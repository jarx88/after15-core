function bind(root=document){root.querySelectorAll('.prev').forEach(e=>e.onclick=()=>nav(-1));root.querySelectorAll('.next').forEach(e=>e.onclick=()=>nav(1))}function tab(t){S.tab=t;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));['calendar','report','projects','trend'].forEach(v=>$('#'+v+'-view').classList.toggle('hidden',v!==t));render()}function render(){S.tab==='calendar'?calendar():S.tab==='report'?report():S.tab==='projects'?projectView():trend()}document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>tab(e.dataset.tab));bind();$('#rebuild').onclick=async()=>{try{let r=await(await api('/api/rebuild',{method:'POST'})).json();S.cache.clear();render();toast(`Przeliczono ${r.updated} dni — manual_override zachowane`)}catch(e){toast(e.message)}};addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')nav(-1);else if(e.key==='ArrowRight')nav(1);else if(e.key==='Escape')close();else if(e.key==='Enter'&&S.tab==='calendar'){let t=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Warsaw'});if(t.startsWith(S.month))openDay(t)}});render();
// start: dociąga tylko ostatni tydzień (pełny przelot ~5 GB jest pod przyciskiem ↻)
(async()=>{try{await api('/api/rebuild?days=7',{method:'POST'});S.cache.clear();render()}catch(e){}})();
(function(){
// lisek rysowany wektorowo — pozy interpolowane, więc przejścia są płynne
const C={k:'#2a1c12',d:'#b06a22',o:'#e0952f',l:'#f5c163',w:'#f7efe2',e:'#12100e',p:'#c9705f',m:'#7a2f34'};
const UW=32,UH=24,cv=$('#pet-cv'),pet=$('#pet');
// jeden piksel liska = całkowita liczba fizycznych pikseli ekranu, a pozycja ląduje
// na ich siatce — inaczej GPU interpoluje przy skalowaniu i lisek się smuży
const DPR=devicePixelRatio||1,PS=Math.max(1,Math.round(3*DPR)),S=PS/DPR;
const snap=v=>Math.round(v*DPR)/DPR;
cv.width=UW*PS;cv.height=UH*PS;
cv.style.width=UW*S+'px';cv.style.height=UH*S+'px';
const cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
// lisek powstaje wektorowo w siatce 1:1, potem trafia w paletę i dostaje kontur —
// stąd pixelowy wygląd bez ręcznego układania pikseli
const off=document.createElement('canvas');off.width=UW;off.height=UH;
const og=off.getContext('2d');
const PAL=[[42,28,18],[176,106,34],[224,149,47],[245,193,99],[247,239,226],[18,16,14],[201,112,95]];
function pixelize(){
  const img=og.getImageData(0,0,UW,UH),d=img.data,solid=new Uint8Array(UW*UH);
  for(let i=0,px=0;i<d.length;i+=4,px++){
    if(d[i+3]<128){d[i+3]=0;continue}
    d[i+3]=255;solid[px]=1;
    let bi=0,bd=1e9;
    for(let k=0;k<PAL.length;k++){
      const p=PAL[k],dd=(p[0]-d[i])**2+(p[1]-d[i+1])**2+(p[2]-d[i+2])**2;
      if(dd<bd){bd=dd;bi=k}
    }
    d[i]=PAL[bi][0];d[i+1]=PAL[bi][1];d[i+2]=PAL[bi][2];
  }
  for(let y=0;y<UH;y++)for(let x=0;x<UW;x++){
    const px=y*UW+x;
    if(solid[px])continue;
    if((x>0&&solid[px-1])||(x<UW-1&&solid[px+1])||(y>0&&solid[px-UW])||(y<UH-1&&solid[px+UW])){
      const i=px*4;d[i]=42;d[i+1]=28;d[i+2]=18;d[i+3]=255;
    }
  }
  og.putImageData(img,0,0);
}
function drawFox(g,P){
  const u=n=>n;
  const {legFR,legFL,legBR,legBL,legLen,bodyY,bodyRot,headY,headX,headRot,
         tailRot,earRot,eye,mouth,squat,lying,fluff}=P;
  const CY=14.2-squat+bodyY,BX=13.2;
  g.lineJoin='round';
  g.save();g.translate(u(8.2),u(CY-.8));g.rotate(tailRot);     // ogon
  g.fillStyle=C.o;g.beginPath();
  g.moveTo(u(1.5),u(1.7));
  g.quadraticCurveTo(u(-3.4),u(2.6),u(-5.8),u(-.6));
  g.quadraticCurveTo(u(-7.8),u(-3.4),u(-5.2),u(-5.6));
  g.quadraticCurveTo(u(-2.6),u(-7),u(-2),u(-4));
  g.quadraticCurveTo(u(-1.2),u(-1.4),u(1.7),u(-1));
  g.closePath();g.fill();
  g.save();g.clip();
  g.fillStyle=C.w;g.beginPath();g.ellipse(u(-5.2),u(-4.2),u(2.9)*fluff,u(2.7)*fluff,-.35,0,7);g.fill();
  g.restore();g.restore();
  const leg=(x,y,a,color)=>{
    g.save();g.translate(u(x),u(y));g.rotate(a);
    g.strokeStyle=color;g.lineWidth=u(1.9);g.lineCap='round';
    g.beginPath();g.moveTo(0,0);g.lineTo(0,u(legLen));g.stroke();
    g.fillStyle=C.w;g.beginPath();g.ellipse(0,u(legLen+.1),u(1),u(.8),0,0,7);g.fill();
    g.restore();
  };
  leg(BX-2.4,CY+1.2,legBL,C.d);leg(BX+4.2,CY+1,legFL,C.d);
  g.strokeStyle=C.o;g.lineWidth=u(3.4);g.lineCap='round';
  g.beginPath();g.moveTo(u(BX+4.4),u(CY-1.2));g.lineTo(u(21.4+headX-1.2),u(CY-4.3+headY+1.4));g.stroke();
  g.save();g.translate(u(BX),u(CY));g.rotate(bodyRot);g.translate(-u(BX),-u(CY));
  const body=()=>{g.beginPath();
    g.ellipse(u(BX),u(CY),u(6.1),u(4.1-lying*.6),-.05,0,7);
    g.ellipse(u(BX+5),u(CY-.6),u(3.8),u(3.5),0,0,7)};
  g.fillStyle=C.o;body();g.fill();
  g.save();body();g.clip();
  g.fillStyle=C.l;g.beginPath();g.ellipse(u(BX-.6),u(CY-3.3),u(6.2),u(2.3),-.05,0,7);g.fill();
  g.fillStyle=C.w;g.beginPath();g.ellipse(u(BX+3.8),u(CY+3.6),u(4),u(1.9),.06,0,7);g.fill();
  g.restore();g.restore();
  leg(BX-.8,CY+1.2,legBR,C.o);leg(BX+5.6,CY+1,legFR,C.o);
  g.save();g.translate(u(21.4+headX),u(CY-4.3+headY));g.rotate(headRot);
  const ear=(x,y,rot)=>{g.save();g.translate(u(x),u(y));g.rotate(rot);
    g.fillStyle=C.o;g.beginPath();
    g.moveTo(u(-1.7),u(1.5));g.quadraticCurveTo(u(-1),u(-2.7),u(.4),u(-2.6));
    g.quadraticCurveTo(u(1.5),u(-1.4),u(1.7),u(1.5));g.closePath();g.fill();
    g.fillStyle=C.p;g.beginPath();
    g.moveTo(u(-.7),u(1.1));g.quadraticCurveTo(u(-.35),u(-1.4),u(.3),u(-1.4));
    g.quadraticCurveTo(u(.85),u(-.7),u(.9),u(1.1));g.closePath();g.fill();g.restore()};
  ear(-2,-2.9,-.34+earRot);ear(1.9,-3.1,.2-earRot);
  g.fillStyle=C.o;g.beginPath();
  g.moveTo(u(-3.9),u(-.6));
  g.quadraticCurveTo(u(-3.7),u(-3.7),u(-.4),u(-3.9));
  g.quadraticCurveTo(u(3.1),u(-3.8),u(3.5),u(-1));
  g.quadraticCurveTo(u(5.7),u(-.6),u(5.8),u(.7));
  g.quadraticCurveTo(u(5.5),u(2.1),u(2.6),u(2.5));
  g.quadraticCurveTo(u(-1.4),u(3.5),u(-3.4),u(1.6));
  g.closePath();g.fill();
  g.save();g.clip();
  g.fillStyle=C.l;g.beginPath();g.ellipse(u(-.5),u(-2.7),u(3.5),u(1.8),0,0,7);g.fill();
  g.fillStyle=C.w;g.beginPath();g.ellipse(u(2.7),u(1.6),u(3.3),u(1.8),.12,0,7);g.fill();
  g.restore();
  g.fillStyle=C.k;g.beginPath();g.ellipse(u(5.2),u(.5),u(1),u(.85),0,0,7);g.fill();
  if(mouth>.1){g.fillStyle=C.m;g.beginPath();g.ellipse(u(3.9),u(2),u(1.2)*mouth,u(1)*mouth,0,0,7);g.fill()}
  if(eye>.15){g.fillStyle=C.e;g.beginPath();g.ellipse(u(1.1),u(-.5),u(.85),u(1.05)*eye,0,0,7);g.fill()}
  else{g.strokeStyle=C.k;g.lineWidth=u(.6);g.lineCap='round';g.beginPath();
       g.moveTo(u(.4),u(-.4));g.lineTo(u(1.9),u(-.4));g.stroke()}
  g.restore();
}
const BASE={legFR:0,legFL:0,legBR:0,legBL:0,legLen:3.5,bodyY:0,bodyRot:0,headY:0,headX:0,headRot:0,
            tailRot:0,earRot:0,eye:1,mouth:0,squat:0,lying:0,fluff:1};
const POSE={
  walk:{},run:{bodyRot:-.06,legLen:3.3},idle:{},
  sit:{legFR:.05,legFL:.05,legBR:1.5,legBL:1.5,legLen:2.4,squat:-1,bodyRot:.42,headX:-1.9,headY:-1.9,tailRot:.62,fluff:1.05},
  yawn:{legFR:.05,legFL:.05,legBR:1.5,legBL:1.5,legLen:2.4,squat:-1,bodyRot:.42,headX:-1.9,headY:-2.1,tailRot:.5,eye:0,mouth:1,earRot:-.2},
  sleep:{legFR:1.6,legFL:1.6,legBR:1.55,legBL:1.55,legLen:1,squat:-3,lying:1,headX:-2.2,headY:3.5,tailRot:1.5,eye:0,fluff:1.1},
  jump:{legFR:1.1,legFL:1.3,legBR:-1.1,legBL:-1.3,legLen:2.8,tailRot:-.6,bodyRot:-.14},
  sniff:{legFR:.2,legFL:-.15,legBR:-.15,legBL:.2,headX:1.2,headY:3,headRot:.35,tailRot:-.1},
  spin:{bodyRot:-.1,tailRot:-.7},
};
const rnd=(a,b)=>a+Math.random()*(b-a)|0;
const DUR={walk:[60,200],run:[30,80],sit:[80,260],sleep:[240,700],idle:[20,70],yawn:[26,26],sniff:[50,110],jump:[80,80],spin:[26,26]};
const cur={...BASE};
let x=40,air=0,vy=0,dir=1,mode='walk',after=null,t=0,phase=0,tick=0,blink=0,target=null;
function setMode(m,next){
  mode=m;after=next||null;t=rnd(DUR[m][0],DUR[m][1]);
  pet.classList.toggle('asleep',m==='sleep');
  if(m==='jump'){vy=6.4;air=0}
}
function fx(sym,cls){
  const e=document.createElement('div');
  e.className='pet-fx '+cls;e.textContent=sym;
  e.style.left=(x+UW*S/2)+'px';e.style.bottom=(UH*S*.75+air)+'px';
  e.style.setProperty('--dx',rnd(-14,14)+'px');
  document.body.appendChild(e);setTimeout(()=>e.remove(),1000);
}
function step(){
  if(document.hidden)return;
  tick++;
  const max=innerWidth-UW*S;
  if(blink)blink--;
  else if(Math.random()<.012&&mode!=='sleep'&&mode!=='yawn')blink=3;
  const moving=mode==='walk'||mode==='run'||mode==='sniff';
  if(moving){
    const v=mode==='run'?3:mode==='sniff'?.4:.95;
    if(target!==null){
      dir=target>x?1:-1;
      if(Math.abs(target-x)<8){target=null;setMode('sit')}
    }
    x+=dir*v;
    if(x>=max){x=max;dir=-1}
    if(x<=0){x=0;dir=1}
    phase+=mode==='run'?.42:mode==='sniff'?.09:.24;
  }else if(mode==='jump'){
    vy-=.55;air+=vy;
    x=Math.max(0,Math.min(max,x+dir*1.8));
    if(air<=0){air=0;setMode('run')}
  }else if(mode==='spin'){
    if(tick%3===0)dir=-dir;
    phase+=.5;
  }
  // płynne dojście do docelowej pozy
  const goal={...BASE,...POSE[mode]};
  for(const k in goal)cur[k]+=(goal[k]-cur[k])*.2;
  const P={...cur};
  if(moving||mode==='spin'){                       // cykl kroków na wierzchu pozy
    const a=mode==='run'?.6:mode==='sniff'?.22:.42;
    P.legFR+=a*Math.sin(phase);P.legBL+=a*Math.sin(phase);
    P.legFL+=a*Math.sin(phase+Math.PI);P.legBR+=a*Math.sin(phase+Math.PI);
    P.bodyY-=Math.abs(Math.sin(phase))*.3;
    P.tailRot+=.12*Math.sin(phase*.6);
  }else if(mode==='sleep'){
    P.bodyY-=Math.sin(tick*.08)*.18;               // oddech
  }else if(mode==='sit'||mode==='idle'){
    P.tailRot+=.16*Math.sin(tick*.09);             // machanie ogonem
  }
  if(blink)P.eye=.12;
  og.clearRect(0,0,UW,UH);
  og.save();
  if(dir<0){og.translate(UW,0);og.scale(-1,1)}
  drawFox(og,P);
  og.restore();
  pixelize();
  cx.clearRect(0,0,UW*PS,UH*PS);
  const sh=Math.max(0,1-air/26);
  cx.fillStyle='rgba(0,0,0,'+(.32*sh)+')';
  cx.fillRect(Math.round(UW*PS/2-UW*PS*.26*sh),UH*PS-PS,Math.round(UW*PS*.52*sh),PS);
  cx.drawImage(off,0,0,UW*PS,UH*PS);
  // pozycja przypięta do siatki fizycznych pikseli — na ułamkowej lisek rozmywa
  // się przy kompozytowaniu i ciągnie za sobą smugę
  pet.style.transform='translate('+snap(x)+'px,'+snap(-air)+'px)';
  if(--t>0||mode==='jump')return;
  if(mode==='walk'){const r=Math.random();setMode(r<.4?'sit':r<.7?'sniff':'idle')}
  else if(mode==='sniff')setMode(Math.random()<.3?'sit':'walk');
  else if(mode==='sit')setMode(Math.random()<.45?'yawn':'walk',Math.random()<.45?'sleep':null);
  else if(mode==='yawn')setMode(after||'sit');
  else if(mode==='sleep')setMode('yawn','sit');
  else if(mode==='run'||mode==='spin')setMode('walk');
  else{if(Math.random()<.35)dir=-dir;setMode('walk')}
}
setInterval(step,50);
pet.onclick=()=>{
  if(mode==='sleep'){setMode('yawn','sit');fx('?','spark');return}
  fx('♥','heart');dir=Math.random()<.5?-1:1;setMode('jump');
};
pet.ondblclick=()=>{fx('✨','spark');setMode('spin')};
addEventListener('mousemove',e=>{
  if(mode==='sleep'||mode==='jump'||mode==='spin')return;
  if(innerHeight-e.clientY>90)return;
  target=Math.max(0,Math.min(innerWidth-UW*S,e.clientX-UW*S/2));
  if(mode!=='walk'&&mode!=='run')setMode('walk');else if(t<40)t=40;
},{passive:true});
window.petCheer=()=>{if(mode==='sleep')setMode('sit');fx('✨','spark');setMode('jump')};
})();
</script></body></html>
