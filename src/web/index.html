<div id="calendar-view" class="layout"><main class="main"><div class="month-head"><div class="month-nav"><button class="nav prev">‹</button><span class="month-title"></span><button class="nav next">›</button></div><span class="hint">←/→ miesiąc · Enter otwiera dziś · Esc zamyka</span><div class="month-total"><div class="label">Suma miesiąca</div><div class="total" id="month-total">0:00</div><div class="subtle" id="day-count"></div></div></div><div class="dow"><span>pn</span><span>wt</span><span>śr</span><span>cz</span><span>pt</span><span>so</span><span>nd</span></div><div class="grid" id="grid"></div><div class="legend"><span><i style="background:var(--regular)"></i>Regularna <em>6–15</em></span><span><i style="background:var(--afternoon)"></i>Popołudniowa <em>15–21</em></span><span><i style="background:var(--saturday_afternoon)"></i>Sobota pop. <em>8–14</em></span><span><i style="background:var(--weekend)"></i>Weekend <em>cały dzień</em></span></div></main><aside id="drawer" class="drawer hidden"></aside></div><main id="report-view" class="view hidden"></main><main id="projects-view" class="view hidden"></main></div><div id="toast" class="toast hidden"></div><div id="pet" title="Lisek od nadgodzin">🦊</div>
<script>
const S={month:new Date().toISOString().slice(0,7),tab:'calendar',selected:null,mode:'overtime',cache:new Map()},shifts={regular:['Regularna','#5286c9'],afternoon:['Popołudniowa','#9a7fd1'],saturday_afternoon:['Sobota pop.','#3fa08c'],weekend:['Weekend','#cf5f5f']},months=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'],weekdays=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),hm=h=>{let m=Math.round(h*60);return Math.floor(m/60)+':'+String(Math.abs(m%60)).padStart(2,'0')},disp=n=>String(n).replace(/^-home-[^-]+-Programowanie-/,'').split('--claude-worktrees-')[0];
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(S.tt);S.tt=setTimeout(()=>e.classList.add('hidden'),3000)}async function api(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(await r.text()||`HTTP ${r.status}`);$('#fresh').textContent=new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});return r}async function month(force=false){if(!force&&S.cache.has(S.month))return S.cache.get(S.month);let d=await(await api('/api/month/'+S.month)).json();S.cache.set(S.month,d);return d}function label(){let[y,m]=S.month.split('-').map(Number);return months[m-1]+' '+y}function nav(n){let[y,m]=S.month.split('-').map(Number),d=new Date(y,m-1+n,1);S.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');S.selected=null;render()}function shift(type){return `<span class="shift"><i class="dot" style="background:${shifts[type][1]}"></i>${shifts[type][0]}</span>`}function projects(d){return d.projects.filter(p=>p.weekday_hours+p.weekend_hours>0).map(p=>`${E(disp(p.name))} (${hm(p.weekday_hours+p.weekend_hours)})`).join(', ')||'—'}
async function calendar(){try{let d=S.data=await month();$('.month-title').textContent=label();$('#month-total').textContent=d.total_formatted;$('#day-count').textContent=d.days_count+' dni z nadgodzinami';let g=$('#grid'),lead=(new Date(d.days[0].date+'T12:00').getDay()+6)%7,today=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Warsaw'});g.innerHTML='<div class="cell empty"></div>'.repeat(lead)+d.days.map(x=>`<div class="cell ${x.date>today?'future ':''}${x.date===today?'today ':''}${x.date===S.selected?'selected':''}" data-date="${x.date}"><span class="num">${+x.date.slice(8)}</span><i class="dot" style="background:${shifts[x.shift][1]}"></i>${x.manual_override?'<b class="badge">RĘCZNE</b>':''}${x.hours>0?`<span class="hours">${x.formatted}</span>`:''}</div>`).join('');g.querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>openDay(e.dataset.date))}catch(e){toast(e.message)}}
async function openDay(date){try{S.selected=date;S.day=await(await api('/api/day/'+date)).json();calendar();drawer()}catch(e){toast(e.message)}}function clock(s){if(s==='24:00')return 24;let[h,m]=s.split(':').map(Number);return h+m/60}function timeline(d){let w=d.work_window&&[clock(d.work_window.start),clock(d.work_window.end)],lo=w?w[0]:8,hi=w?w[1]:18;d.sessions.forEach(s=>{lo=Math.min(lo,clock(s.start));hi=Math.max(hi,clock(s.end))});lo=Math.max(0,Math.floor(lo)-1);hi=Math.min(24,Math.ceil(hi)+1);let span=Math.max(1,hi-lo),pos=h=>(h-lo)/span*100,step=span>12?3:span>7?2:1,t='';for(let h=Math.ceil(lo);h<=hi;h+=step)t+=`<i class="tick" style="left:${pos(h)}%"><small>${h}:00</small></i>`;let band=w?`<div class="band" style="left:${pos(w[0])}%;width:${(w[1]-w[0])/span*100}%"><small>okno pracy</small></div>`:'',ex=new Set(d.excluded_sessions),lanes=d.sessions.map(s=>{let a=clock(s.start),b=clock(s.end),off=ex.has(excKey(s)),z=[],add=(x,y,ot)=>{if(y>x)z.push(`<i class="bar-seg" style="left:${pos(x)}%;width:${(y-x)/span*100}%;background:${ot?'var(--accent)':'#2b313a'};border-color:${ot?'var(--accent)':'var(--strong)'}"></i>`)};if(!w)add(a,b,1);else{add(a,Math.min(b,w[0]),1);add(Math.max(a,w[0]),Math.min(b,w[1]),0);add(Math.max(a,w[1]),b,1)}return `<div class="lane ${off?'removed':''}">${z.join('')}</div>`}).join('');return `<div class="section">Sesje vs okno pracy <span class="axis">${hm(lo)} — ${hm(hi)}</span></div><div class="timeline"><div class="timeline-inner">${t}${band}${lanes||'<div class="lane"></div>'}</div></div><div class="key">${w?'<span><i></i>w oknie pracy</span>':''}<span><i class="ot"></i>nadgodziny</span></div>`}
function excKey(s){return s.start+'→'+s.end}
function cards(d){let ex=new Set(d.excluded_sessions);return d.sessions.length?`<div class="sessions">${d.sessions.map((s,i)=>{let off=ex.has(excKey(s));return `<div class="session ${off?'removed':''}"><div class="session-top"><span class="session-time">${s.start} → ${s.end}</span><span class="session-dur">${hm(s.duration_s/3600)} h</span><span class="session-ot ${s.overtime_h>0?'positive':''}">nadgodziny: ${hm(s.overtime_h)}</span>${s.overtime_h>0&&!off?`<button class="x-session" data-i="${i}" title="Odejmij nadgodziny tej sesji od sumy dnia">✕</button>`:''}</div>${s.projects.map(p=>`<div class="project-line"><span>${E(p.name)}</span><span class="right mono">${Math.round(p.share*100)}%</span><span class="right mono">${hm(s.duration_s/3600*p.share)}</span></div>`).join('')}</div>`}).join('')}</div>`:'<div class="empty-note">Brak sesji dla tego dnia</div>'}function drawer(){let d=S.day,b=$('#drawer');if(!d){b.classList.add('hidden');return}let date=new Date(d.date+'T12:00'),sh=shifts[d.shift],shown=d.manual_override?(d.stored_hours??d.computed_hours):d.computed_hours,win=d.work_window?`okno ${d.work_window.start}–${d.work_window.end}`:'brak okna — całość to nadgodziny';b.classList.remove('hidden');b.innerHTML=`<div class="drawer-head"><div class="title-row"><span class="drawer-date">${weekdays[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}</span><button class="close">✕</button></div><div class="meta"><i class="dot" style="background:${sh[1]}"></i>${sh[0]} · <span class="mono">${win}</span>${d.manual_override?'<b class="badge">RĘCZNE</b>':''}</div></div><div class="drawer-body">${timeline(d)}<div class="section">Sesje (${d.sessions.length})</div>${cards(d)}</div><div class="drawer-foot"><div class="sum-row"><span class="label">Suma dnia</span><span class="day-total">${hm(shown)}</span></div>${d.manual_override?`<div class="computed">wyliczone: ${hm(d.computed_hours)}</div>`:''}<div class="edit"><input value="${hm(shown)}" aria-label="Godziny"><button class="primary save">Zapisz ręcznie</button>${d.manual_override?'<button class="ghost restore">Przywróć wyliczone</button>':'<button class="ghost lock">Zablokuj wyliczone</button>'}</div><div class="note">Ręczna wartość jest chroniona przed przeliczeniem archiwum.</div></div>`;b.querySelector('.close').onclick=close;b.querySelector('.save').onclick=()=>mutate('PUT',{hours:b.querySelector('input').value},'Zapisano ręczną korektę');b.querySelectorAll('.x-session').forEach(e=>e.onclick=()=>{let s=d.sessions[+e.dataset.i],base=d.manual_override?(d.stored_hours??d.computed_hours):d.computed_hours;if(d.excluded_sessions.includes(excKey(s)))return;mutate('PUT',{hours:hm(Math.max(0,base-s.overtime_h)),exclude_session:excKey(s)},`Odjęto ${hm(s.overtime_h)} — zapisano jako ręczne`)});let e=b.querySelector('.restore')||b.querySelector('.lock');e.onclick=()=>mutate(d.manual_override?'DELETE':'POST',null,d.manual_override?'Przywrócono wartość wyliczoną':'Zablokowano wartość wyliczoną',d.manual_override?'/override':'/lock')}
async function mutate(method,body,msg,suffix=''){try{S.day=await(await api(`/api/day/${S.selected}${suffix}`,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):null})).json();S.cache.delete(S.month);await calendar();drawer();toast(msg);return true}catch(e){toast(e.message.includes('format')?'Nieprawidłowy format — użyj H:MM':e.message);return false}}function close(){S.selected=null;S.day=null;$('#drawer').classList.add('hidden');calendar()}function rows(ds){return ds.filter(d=>d.hours>0).map(d=>`<div class="day-row" data-date="${d.date}"><span class="mono">${d.date}</span>${shift(d.shift)}<span>${projects(d)}</span><span class="${d.manual_override?'manual':''}">${d.source}</span><strong class="right mono" style="color:var(--accent)">${d.formatted}</strong></div>`).join('')}
async function report(){try{let d=S.data=await month(),p={};d.days.forEach(x=>x.projects.forEach(y=>{let z=p[disp(y.name)]??={wd:0,we:0};z.wd+=y.weekday_hours;z.we+=y.weekend_hours}));let ps=Object.entries(p).sort((a,b)=>b[1].wd+b[1].we-a[1].wd-a[1].we),pln=ps.reduce((n,[,x])=>n+x.wd*d.rates.weekday_pln+x.we*d.rates.weekend_pln,0);$('#report-view').innerHTML=`<div class="report-head"><div class="month-nav"><button class="nav prev">‹</button><span class="month-title">${label()}</span><button class="nav next">›</button></div><div class="report-actions"><a class="primary" href="/api/report/${S.month}.pdf" target="_blank">Eksport PDF</a></div></div><div class="report-grid"><div class="data-table"><div class="table-head"><span>Data</span><span>Zmiana</span><span>Projekty</span><span>Źródło</span><span class="right">Nadgodz.</span></div>${rows(d.days)}<div class="table-foot"><span>Suma miesiąca</span><strong class="mono" style="color:var(--accent)">${d.total_formatted}</strong></div></div><aside class="project-panel"><div class="break-head"><span>Projekt</span><span>Dzień</span><span>Wknd</span><span>Suma</span><span class="right">PLN</span></div>${ps.map(([n,x])=>`<div class="break-row"><span>${E(n)}</span><span class="mono">${hm(x.wd)}</span><span class="mono">${hm(x.we)}</span><span class="mono">${hm(x.wd+x.we)}</span><span class="right mono">${Math.round(x.wd*d.rates.weekday_pln+x.we*d.rates.weekend_pln)}</span></div>`).join('')}<div class="pay"><span>Wynagrodzenie netto</span><strong>${Math.round(pln)} PLN</strong></div><div class="rates">${Math.round(d.rates.weekday_pln)} PLN/h dzień · ${Math.round(d.rates.weekend_pln)} PLN/h weekend</div></aside></div>`;bind($('#report-view'));$('#report-view').querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>{tab('calendar');openDay(e.dataset.date)})}catch(e){toast(e.message)}}
async function projectView(){try{let d=await(await api('/api/projects?mode='+S.mode)).json(),agg={};d.projects.forEach(p=>agg[disp(p.name)]=(agg[disp(p.name)]||0)+p.hours);d.projects=Object.entries(agg).map(([name,hours])=>({name,hours,formatted:hm(hours),share_pct:d.total_hours?hours/d.total_hours*100:0})).sort((a,b)=>b.hours-a.hours);let max=Math.max(...d.projects.map(p=>p.hours),.01);$('#projects-view').innerHTML=`<div class="projects-head"><div><b style="font-size:15px">Projekty</b><div class="subtle">od początku monitorowania</div></div><div class="segmented"><button class="${S.mode==='overtime'?'active':''}" data-mode="overtime">Tylko nadgodziny</button><button class="${S.mode==='all'?'active':''}" data-mode="all">Wszystkie godziny</button></div></div><div class="projects-table"><div class="table-head"><span>#</span><span>Projekt</span><span></span><span class="right">Godziny</span><span class="right">Udział</span></div>${d.projects.map((p,i)=>`<div class="project-row"><span class="mono subtle">${i+1}</span><span>${E(p.name)}</span><div class="project-bar"><i style="width:${p.hours/max*100}%"></i></div><strong class="right mono">${p.formatted}</strong><span class="right mono subtle">${p.share_pct.toFixed(1)}%</span></div>`).join('')}<div class="table-foot"><span>${S.mode==='all'?'Suma wszystkich godzin':'Suma nadgodzin'}</span><strong class="mono" style="color:var(--accent)">${d.total_formatted}</strong></div></div><div class="note">Godziny sesji przypisywane do projektów proporcjonalnie do ścieżek plików. Od 2025-07-28.</div>`;$('#projects-view').querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{S.mode=e.dataset.mode;projectView()})}catch(e){toast(e.message)}}function bind(root=document){root.querySelectorAll('.prev').forEach(e=>e.onclick=()=>nav(-1));root.querySelectorAll('.next').forEach(e=>e.onclick=()=>nav(1))}function tab(t){S.tab=t;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));['calendar','report','projects'].forEach(v=>$('#'+v+'-view').classList.toggle('hidden',v!==t));render()}function render(){S.tab==='calendar'?calendar():S.tab==='report'?report():projectView()}document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>tab(e.dataset.tab));bind();$('#rebuild').onclick=async()=>{try{let r=await(await api('/api/rebuild',{method:'POST'})).json();S.cache.clear();render();toast(`Przeliczono ${r.updated} dni — manual_override zachowane`)}catch(e){toast(e.message)}};addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')nav(-1);else if(e.key==='ArrowRight')nav(1);else if(e.key==='Escape')close();else if(e.key==='Enter'&&S.tab==='calendar'){let t=new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Warsaw'});if(t.startsWith(S.month))openDay(t)}});render();
(function(){let pet=$('#pet'),x=30,dir=1,mode='walk',t=0;pet.classList.add('walk');setInterval(()=>{if(mode==='walk'){x+=dir*1.5;let max=innerWidth-34;if(x>=max){dir=-1}else if(x<=0){dir=1}pet.style.left=x+'px';pet.style.transform=dir<0?'scaleX(-1)':'';if(--t<=0&&Math.random()<.004){mode='sleep';pet.classList.remove('walk');pet.classList.add('zzz');t=0}}else if(Math.random()<.006){mode='walk';pet.classList.add('walk');pet.classList.remove('zzz');t=300}},40)})();
</script></body></html>
